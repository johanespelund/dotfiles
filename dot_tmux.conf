set -sg escape-time 50
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Window names follow the current directory
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Switch windows: Shift+Alt+h/l or Shift+arrows
bind -n M-H previous-window
bind -n M-L next-window
bind -n S-Left previous-window
bind -n S-Right next-window

# Open panes in current directory
bind '-' split-window -v -c "#{pane_current_path}"
bind ']' split-window -h -c "#{pane_current_path}"

# Copy mode: vi keys, v to select, C-v for block selection.
# y is bound by tmux-yank (xsel -> desk clipboard); C-h/j/k/l by vim-tmux-navigator.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copies also go out as OSC 52 to the attached terminal, so copying works from
# Windows Terminal over SSH too. Also forwards OSC 52 from Neovim.
set -s set-clipboard on

# Light/dark, shared with Neovim via ~/.local/state/theme. prefix + T toggles
# tmux and every running Neovim (~/.local/bin/theme).
if-shell 'grep -qx light ~/.local/state/theme' \
  'set -g @catppuccin_flavour latte; set -g window-style "fg=#4c4f69,bg=#eff1f5"'
bind T run-shell '~/.local/bin/theme toggle >/dev/null'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
